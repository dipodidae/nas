## playlist-generator.subdomain.conf — Jellyfin Playlist Generator (unified mode)
## Source repo: ~/projects/jellyfin-playlist-generator
# Gated here, by the one tinyauth door (ADR-0034). The app's own internal nginx
# still does basic auth (AUTH_USER/AUTH_PASS) as well for now; that is TWO
# prompts, and the app-level one is removed in the next block. The two do not
# collide the way auth_basic and auth_request do, because the app's 401 arrives
# as an UPSTREAM RESPONSE and `proxy_intercept_errors` is off (checked: SWAG's
# proxy.conf does not set it), so it passes through to the client untouched
# instead of being swallowed by `error_page 401`.
# Upstream is the unified container on :80.
# make sure your DNS has a record for playlist-generator -> PUBLIC_DOMAIN
# (covered by the wildcard *.4eva.me record + cert).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name playlist-generator.*;

    include /config/nginx/ssl.conf;

    # M3U uploads / large library responses; mirror the app's nginx (0 = unlimited).
    client_max_body_size 0;

    # The one door. Server half; the location half is inside `location /`.
    include /config/nginx/tinyauth-server.conf;

    location / {
        include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app playlist-generator;
        set $upstream_port 80;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # SSE: generation streams progress over /api/*; don't buffer it.
        # (proxy.conf already sets proxy_read_timeout; don't redefine it.)
        proxy_buffering off;
        proxy_cache off;
    }
}
