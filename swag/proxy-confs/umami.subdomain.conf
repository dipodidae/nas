## umami.subdomain.conf -- Umami web analytics. ADR-0056.
##
## protect, with ONE exact path open: `POST /api/send`, the ingestion endpoint.
## Its only legitimate caller is the ongehoord Nuxt server on Vercel
## (nuxt-umami `proxy: 'cloak'`), which cannot follow a 302 to a login page.
## Everything else -- the dashboard AND its /api/* data calls -- is behind the
## door, and then behind Umami's own login (with TOTP) as a second factor.
##
## Deliberately NOT open: /script.js (no browser loads the tracker -- the site
## ships its own), /api/batch, /share/* (public dashboards). Opening any of
## them is a decision, not a fix.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name umami.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    # The one door. Server half; the location half is inside `location /`.
    include /config/nginx/tinyauth-server.conf;

    location / {
        include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app umami;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Ingestion. Exact match, POST only (CORS preflight is not needed: the
    # caller is a server, not a browser). An event without a valid website
    # ID -- which never leaves Vercel's server config -- is rejected by Umami
    # itself.
    location = /api/send {
        limit_except POST {
            deny all;
        }

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app umami;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
