## 2026-09-01 — hand-written (no LSIO preset exists for ntfy).
# Publishes the self-hosted ntfy at ntfy.<PUBLIC_DOMAIN> so a phone can
# subscribe to the stack_watchdog alert topic. Requires a CNAME for `ntfy`.
#
# ntfy runs auth-default-access=deny-all, so this vhost is safe to expose:
# every read and write needs the credentials in .env (NAS_ALERT_USER /
# NAS_ALERT_PASSWORD). No basic-auth layer here on purpose — the ntfy Android
# and iOS clients authenticate to ntfy itself, and an extra nginx auth_basic
# in front would break them.
#
# The one non-default bit below matters: ntfy holds subscriptions open as
# long-lived event streams, so proxy buffering must be off.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ntfy.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ntfy;
        set $upstream_port 8410;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Long-lived subscription streams (SSE / WebSocket / raw JSON stream):
        # buffering must be off or nginx holds the events instead of passing
        # them straight through. The shared proxy.conf already sets
        # proxy_http_version 1.1 and 240s read/send/connect timeouts, which are
        # longer than ntfy's 45s keepalive — re-declaring any of them here is a
        # duplicate-directive error, not an override.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
