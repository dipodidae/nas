## Version 2026/01/01 - hand-written; no upstream sample ships in SWAG.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name slskd.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # The one door. Server half; the location half is inside `location /`.
    # slskd's UI is SignalR over WebSocket and works through the door: the
    # Upgrade handshake is an ordinary HTTP request carrying the session
    # cookie, so auth_request gets its say once and the socket then lives
    # outside the request cycle. ADR-0034.
    #
    # This gates the BROWSER only. Nothing else here reaches slskd through
    # SWAG: Lidarr resolves slskd:5030 on nas-network and every script uses
    # the 127.0.0.1:5030 loopback publish with API_KEY_SLSKD.
    include /config/nginx/tinyauth-server.conf;

    location / {
        include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app slskd;
        set $upstream_port 5030;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
