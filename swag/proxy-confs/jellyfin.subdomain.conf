## Version 2025/07/18
# make sure that your jellyfin container is named jellyfin
# make sure that your dns has a cname set for jellyfin
# if jellyfin is running in bridge mode and the container is named "jellyfin", the below config should work as is
# if not, replace the line "set $upstream_app jellyfin;" with "set $upstream_app <containername>;"
# or "set $upstream_app <HOSTIP>;" for host mode, HOSTIP being the IP address of jellyfin
# in jellyfin settings, under "Advanced/Networking" add subdomain.mydomain.tld as a known proxy

server {
    listen 443 ssl;
#    listen 443 quic;
    listen [::]:443 ssl;
#    listen [::]:443 quic;

    server_name jellyfin.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # 2026-09-01: redact api_key/ApiKey query params from this vhost's
    # access log — see nginx/site-confs/jellyfin-log-redact.conf for the
    # log_format definition. Scoped to jellyfin only via this directive;
    # every other vhost keeps the server-wide default log format.
    access_log /config/log/nginx/jellyfin-access.log jellyfin_redacted;

    location / {
        # gzip is off server-wide (nginx.conf has `gzip on;` commented out),
        # so there's nothing to exclude for /Videos/* today — noted here so
        # a future `gzip on;` doesn't silently start compressing video
        # streams without this vhost being revisited.
        gzip off;
        # No proxy_cache directive exists anywhere in this vhost or the
        # shared proxy.conf, so nothing is currently caching /Videos/*
        # either — same note, for the same reason.
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app jellyfin;
        set $upstream_port 8096;
        set $upstream_proto http;
        if ($http_user_agent ~ Web0S) {
            add_header Access-Control-Allow-Origin "luna://com.webos.service.config" always;
        }
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Added 2026-09-01: Jellyfin's own reverse-proxy docs recommend disabling
        # proxy buffering for streaming/HLS. Not confirmed as the cause of the
        # Fargo stutter (root cause was a server-side OOM restart, see
        # docs/jellyfin-playback-audit.md) but this is zero-risk and correct
        # practice regardless. Revert: delete these two lines.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ (/jellyfin)?/socket {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app jellyfin;
        set $upstream_port 8096;
        set $upstream_proto http;
        if ($http_user_agent ~ Web0S) {
            add_header Access-Control-Allow-Origin "luna://com.webos.service.config" always;
        }
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    }

    # Restrict access to /metrics
    # https://jellyfin.org/docs/general/networking/monitoring/#prometheus-metrics
    location /metrics {
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.0/8;

        deny all;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app jellyfin;
        set $upstream_port 8096;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
