## Version 2026/10/03
# make sure that your audiobookshelf container is named audiobookshelf
# make sure that your dns has a cname set for audiobookshelf

server {
    listen 443 ssl;
#    listen 443 quic;
    listen [::]:443 ssl;
#    listen [::]:443 quic;

    server_name audiobookshelf.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # Never gated by tinyauth: has its own root-user login AND native mobile
    # apps (Android/iOS, the official client plus Chunky/Listen Audiobook
    # Player) that cannot follow a 302 to a login page. Same reasoning as
    # jellyfin/nextcloud/ntfy. ADR-0034.
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app audiobookshelf;
        set $upstream_port 13378;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
