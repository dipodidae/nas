## AudioMuse-AI web UI (ADR-0053). Browser-only: behind the one door.
#
# NO ungated /api location, unlike the *arr confs. The only API consumer is
# Navidrome's audiomuseai plugin, which calls http://audiomuse:8000 across
# nas-network with a bearer token and never touches SWAG. Nothing off-box
# speaks this API, so there is no path-scope to carve out (ADR-0034).
#
# AudioMuse keeps its OWN login as well (AUTH_ENABLED, admin in its DB):
# upstream application auth, same standing as qui's or slskd's, and the
# thing that makes the bearer token mean anything on the internal hop.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name audiomuse.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    include /config/nginx/tinyauth-server.conf;

    location / {
        include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app audiomuse;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
