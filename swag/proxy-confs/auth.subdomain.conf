## auth.subdomain.conf — the login page for the whole public surface.
##
## Derived from SWAG's shipped tinyauth.subdomain.conf.sample (2025/07/18) with
## ONE change: server_name is `auth.*`, not `tinyauth.*`. The service is called
## tinyauth; the door is called auth. `make check` knows about that one
## deviation explicitly (_ROUTE_ALIASES) rather than letting the filename and
## the service name drift apart silently. ADR-0034.
##
## This route is and must stay UNPROTECTED: it is the thing that hands out the
## session. Do not add tinyauth-location.conf here.
# make sure that your tinyauth container is named tinyauth
# make sure that your dns has a cname set for auth (a wildcard *.4eva.me
# CNAME already covers it; verified 2026-09-04)

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name auth.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app tinyauth;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Link the tracked stylesheet into the login page. tinyauth's UI is a
        # Tailwind v4 + shadcn SPA and it does NOT load anything from its own
        # resources directory by itself (verified: neither the HTML shell nor
        # any JS chunk references /resources/), so the one line that turns a
        # served file into an applied stylesheet has to be injected here.
        #
        # The file itself is served BY TINYAUTH, from
        # tinyauth/custom.css -> /data/resources/custom.css -> /resources/custom.css,
        # so the page still makes zero third-party requests. sub_filter only
        # rewrites the 1.3 KB HTML shell; sub_filter_types defaults to
        # text/html, so the 418 KB JS bundle is never scanned.
        #
        # Accept-Encoding is cleared because nginx cannot filter a compressed
        # response body. That costs nothing here: SWAG sets gzip_vary but not
        # `gzip on`, so nothing on this vhost is compressed today anyway
        # (measured: the JS arrives with no content-encoding at 418131 bytes).
        # If gzip is ever enabled stack-wide, carve /assets/ out into its own
        # location rather than deleting this line.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="/resources/custom.css"></head>';
        sub_filter_once on;
    }
}
