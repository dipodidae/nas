## tinyauth-location.conf — bind-mounted read-only to /config/nginx/tinyauth-location.conf
##
## The other half of the forward-auth plumbing. Include this INSIDE each
## protected `location` block; tinyauth-server.conf goes at server level in the
## same conf. Tracked in this repo for the reason written at the top of
## tinyauth-server.conf. ADR-0034.
##
## Derived from SWAG's /defaults/nginx/tinyauth-location.conf.sample
## (2025/12/17 -- NOT the 2025/06/08 copy that was live in the container, which
## predates the identity headers) plus the $tinyauth_login_url capture.

## Ask tinyauth whether this session may have this resource.
auth_request /tinyauth;

## 401 -> the login redirect. Anything else -- notably a 502 because tinyauth is
## gone -- propagates, so a protected route fails CLOSED. Deliberate: see
## ADR-0034.
error_page 401 = @tinyauth_login;

## A protected response must be REVALIDATED, not served from cache, or logging
## out does not visibly log you out.
##
## Measured 2026-09-04: playlist-generator's SPA shell sends no Cache-Control at
## all (only ETag/Last-Modified), so browsers apply HEURISTIC caching. Log out at
## auth.<domain>, soft-refresh the app, and the page still renders -- the request
## never reached nginx, so auth_request never ran. Ctrl+F5 bypasses the cache and
## bounces you correctly. Sonarr does NOT behave this way because it sends
## `Cache-Control: no-cache, no-store` itself; the gap is per-app, which is
## exactly why the fix belongs here rather than in 13 confs.
##
## `no-cache`, deliberately NOT `no-store`: no-cache still lets the browser keep
## the entity and revalidate it, so a hashed asset comes back 304 (a few hundred
## bytes) instead of being re-downloaded -- and the revalidation goes through
## nginx, which is what makes auth_request run. `no-store` would forbid caching
## entirely and re-download every asset on every page load for no extra safety.
##
## `always` so it also applies to the 302 the login redirect issues.
##
## Note this stacks with an upstream that already sets Cache-Control (sonarr):
## the response then carries two header lines, which browsers read as one
## comma-joined value. Harmless, and verified.
add_header Cache-Control "no-cache" always;

## tinyauth's own login URL, read in @tinyauth_login. auth_request_set variables
## survive into the named location error_page hands off to.
auth_request_set $tinyauth_login_url $upstream_http_x_tinyauth_location;

## Translate the identity headers from the auth subrequest into variables...
auth_request_set $tinyauth_email $upstream_http_remote_email;
auth_request_set $tinyauth_groups $upstream_http_remote_groups;
auth_request_set $tinyauth_name $upstream_http_remote_name;
auth_request_set $tinyauth_user $upstream_http_remote_user;

## ...and inject them into the request to the real upstream.
##
## INVARIANT: these four proxy_set_header lines are UNCONDITIONAL. That is what
## makes the headers unspoofable: proxy_set_header REPLACES whatever the client
## sent, and nginx omits a header whose value is empty -- so a request arriving
## with `Remote-User: admin` reaches the app with no Remote-User at all rather
## than with the one it asked for. Wrapping any of these in an `if`, or dropping
## one because "nothing reads it", reopens that hole for whichever app starts
## trusting the header later. `make check` asserts all four are present.
proxy_set_header Remote-Email $tinyauth_email;
proxy_set_header Remote-Groups $tinyauth_groups;
proxy_set_header Remote-Name $tinyauth_name;
proxy_set_header Remote-User $tinyauth_user;
