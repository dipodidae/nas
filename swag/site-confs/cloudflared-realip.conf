## cloudflared-realip.conf -- bind-mounted read-only to
## /config/nginx/site-confs/cloudflared-realip.conf (http context). ADR-0055.
##
## Every public request now arrives from the cloudflared container, not from
## the visitor. Restore the visitor's address from CF-Connecting-IP -- but ONLY
## when the packet really came from cloudflared's static address. Anything else
## (LAN clients hitting swag directly) keeps its own $remote_addr, and a forged
## CF-Connecting-IP from them is ignored.
##
## Without this, $remote_addr is 172.30.0.250 for the whole internet: nginx
## logs and fail2ban see one client, and tinyauth's per-IP login lockout
## (3 tries / 300 s) would lock EVERYONE out after one stranger's typos.
##
## Apply with `make swag-apply` (ADR-0022 inode rule), never `nginx -s reload`.

set_real_ip_from 172.30.0.250;
real_ip_header CF-Connecting-IP;
