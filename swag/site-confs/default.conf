## Version 2026/03/07 - Changelog: https://github.com/linuxserver/docker-swag/commits/master/root/defaults/nginx/site-confs/default.conf.sample

# TRACKED IN THIS REPO (ADR-0022, ADR-0045). This file is not cosmetic: the
# `include .../proxy-confs/*.subdomain.conf` at the very bottom is what pulls in
# EVERY published route, and the `server_name _` block below is what answers any
# hostname that matches no route. It lived only in the gitignored config dir
# until 2026-09-15, where the nightly backup was the sole thing keeping it.
#
# It is bind-mounted read-only, so the ADR-0022 inode rule applies: apply a
# change with `make swag-apply`, never `nginx -s reload`.

# redirect all traffic to https
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location / {
        return 301 https://$host$request_uri;
    }
}

# main server block
server {
    listen 443 ssl default_server;
#    listen 443 quic reuseport default_server;
    listen [::]:443 ssl default_server;
#    listen [::]:443 quic reuseport default_server;

    server_name _;

    include /config/nginx/ssl.conf;

    root /config/www;
    index index.html index.htm index.php;

    # enable subfolder method reverse proxy confs
    include /config/nginx/proxy-confs/*.subfolder.conf;

    # enable for ldap auth (requires ldap-location.conf in the location block)
    #include /config/nginx/ldap-server.conf;

    # enable for Authelia (requires authelia-location.conf in the location block)
    #include /config/nginx/authelia-server.conf;

    # enable for Authentik (requires authentik-location.conf in the location block)
    #include /config/nginx/authentik-server.conf;

    # enable for Tinyauth (requires tinyauth-location.conf in the location block)
    #include /config/nginx/tinyauth-server.conf;

    # INVARIANT: an unrouted hostname gets an ERROR, not SWAG's welcome page.
    # Stock SWAG serves /config/www/index.html here with a cheerful 200, which
    # is the exact shape of the ADR-0022 `lingarr` incident: a service had its
    # `swag=enable` label and no proxy-conf, so its subdomain answered 200 and
    # looked deployed. A 200 on a hostname this stack does not serve is a lie
    # that costs debugging time -- it is indistinguishable, from a browser, from
    # a route that is up. It also greets the whole internet with the name of the
    # software running here, for no benefit.
    #
    # 404 is the honest answer and it is diagnostically distinct from the other
    # three things a route can say (ADR-0034, ADR-0045):
    #     302 -> the tinyauth door, route exists
    #     500 -> the door is jammed shut (tinyauth unreachable)
    #     502 -> the route exists, its upstream is down
    #     404 -> there is no such route here at all
    location / {
        default_type text/html;
        # ONE single-quoted string. nginx does NOT concatenate adjacent quoted
        # strings the way C does -- `return 404 'a' 'b';` is a syntax error, and
        # inside a `map` it fails as `invalid number of the map parameters`.
        # Single quotes so the HTML can use double quotes; nginx still expands
        # $host inside them, which a `map` value would NOT have done.
        return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - no such route</title><style>
html{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;
color:#e6e8eb;font:16px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:34rem;padding:2rem;text-align:center}
h1{margin:0 0 .5rem;font-size:3.5rem;letter-spacing:-.03em;color:#f0b232}
p{margin:.5rem 0;color:#9aa4b2}
code{background:#1a1d24;padding:.15rem .4rem;border-radius:4px;color:#e6e8eb}
</style></head><body><main>
<h1>404</h1>
<p><strong>No route for this hostname.</strong></p>
<p>Nothing is published at <code>$host</code>.</p>
<p>If you expected a service here, its proxy-conf is missing or has not been applied yet.</p>
</main></body></html>';
    }

    location ~ ^(.+\.php)(.*)$ {
        # enable the next two lines for http auth
        #auth_basic "Restricted";
        #auth_basic_user_file /config/nginx/.htpasswd;

        # enable for ldap auth (requires ldap-server.conf in the server block)
        #include /config/nginx/ldap-location.conf;

        # enable for Authelia (requires authelia-server.conf in the server block)
        #include /config/nginx/authelia-location.conf;

        # enable for Authentik (requires authentik-server.conf in the server block)
        #include /config/nginx/authentik-location.conf;

        fastcgi_split_path_info ^(.+\.php)(.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
    }

    # deny access to .htaccess/.htpasswd files
    location ~ /\.ht {
        deny all;
    }
}

# enable subdomain method reverse proxy confs
#
# LOAD-ORDER GOTCHA (2026-09-01, cost real debugging time once — see
# docs/jellyfin-playback-audit.md):
# This is an inline glob include, not the usual LSIO symlink-per-site pattern,
# and nginx expands `include` globs in *alphabetical* order and processes the
# whole http{} block top-to-bottom. So anything a single vhost needs *defined
# before use* — a `log_format`, a `map`, an `upstream`, a `geo` block — cannot
# live in the vhost's own *.subdomain.conf and cannot be added after this line:
# nginx fails the config test outright with e.g. `nginx: [emerg] unknown log
# format "..."`. Put such a definition in its own file under site-confs/ with a
# name that sorts BEFORE `default.conf` — that is why the Jellyfin access-log
# redaction lives in `site-confs/00-jellyfin-log-redact.conf` and not inside
# `proxy-confs/jellyfin.subdomain.conf`.
# Directives that are merely *duplicates* fail differently and just as hard:
# `proxy.conf` (included by every vhost) already sets proxy_http_version 1.1
# and 240s proxy_read/send/connect_timeout, so re-declaring any of them inside
# a location block is `nginx: [emerg] ... directive is duplicate`, not an
# override. Always `docker exec swag nginx -t` before `nginx -s reload`.
include /config/nginx/proxy-confs/*.subdomain.conf;
