## tinyauth-server.conf — bind-mounted read-only to /config/nginx/tinyauth-server.conf
##
## Half of the forward-auth plumbing (the other half is tinyauth-location.conf).
## Include this at SERVER level in every conf that has a protected location.
##
## WHY THIS IS TRACKED IN THE REPO. SWAG rewrites /config/nginx/*.conf.sample on
## every start but leaves the live .conf alone, so the copy inside the container
## is whatever it was when someone first enabled it -- the live
## tinyauth-location.conf on this host was still the 2025/06/08 sample, five
## revisions behind the 2025/12/17 one in the image, and missing the identity
## headers entirely. A protected route whose auth conf exists only inside the
## container is a route that silently unprotects itself on the next recreate.
## ADR-0022 made the proxy-confs tracked for exactly this reason; these two
## files are /config/nginx/*.conf rather than proxy-confs/*, so they were not
## covered by it. Now they are. ADR-0034.
##
## Derived from SWAG's /defaults/nginx/tinyauth-server.conf.sample (2025/06/08)
## with ONE deliberate change, marked below.

# The auth subrequest. `internal` so no client can reach it directly.
location /tinyauth {
    internal;

    # NOTE: proxy.conf is deliberately NOT included here -- see the INVARIANT
    # further down. ADR-0036.
    # INVARIANT: a VARIABLE upstream plus the Docker resolver, never a literal
    # `proxy_pass http://tinyauth:3000`. nginx resolves a literal proxy_pass
    # hostname at startup and REFUSES TO START on a name it cannot resolve, so a
    # literal here would mean one dead auth container takes down Jellyfin,
    # Nextcloud, ntfy and the apex too. With the variable, nginx starts, the
    # protected routes fail CLOSED (502) and the unprotected ones keep serving.
    # That asymmetry is the design. ADR-0034.
    include /config/nginx/resolver.conf;
    set $upstream_tinyauth tinyauth;
    proxy_pass http://$upstream_tinyauth:3000/api/auth/nginx;

    # An auth subrequest needs no body, and forwarding one on every request to
    # every protected route is pure cost.
    #
    # INVARIANT: these two lines are a PAIR and neither works alone. Dropping
    # the body is not enough, because `proxy_pass_request_body off` does NOT
    # rewrite the Content-Length the subrequest inherits from the parent
    # request. nginx then announces a body it has decided never to send, stays
    # in "sending request" state waiting to write it, and never reads the reply
    # -- which tinyauth has already sent, in microseconds. Sixty seconds later
    # (the DEFAULT proxy_read_timeout; proxy.conf's 240 is deliberately not
    # included here) nginx logs `upstream timed out ... while reading response
    # header from upstream, subrequest: "/tinyauth"`, turns that into a 500,
    # and the browser shows a failed request.
    #
    # The symptom is method-independent and body-dependent, which is what makes
    # it so easy to miss: EVERY request carrying a body hangs 60s and 500s,
    # while every GET -- the whole page load, every asset, every poll -- is
    # fine. So a protected app looks perfectly healthy until you submit
    # something. Measured 2026-09-11 on the live route:
    #     GET, no body          -> 302 in 0.006s
    #     POST, Content-Length 0 -> 302 in 0.006s
    #     POST, 1-byte body     -> hangs 60s -> 500
    #     GET,  1-byte body     -> hangs 60s -> 500
    #
    # INVARIANT: the value is "0", NOT "". The empty string emits a malformed
    # valueless `Content-Length: ` that tinyauth's Go HTTP server rejects with
    # 400 before any auth logic runs -- tolerated by v5.1.3, fatal from v5.2.0,
    # and that 400 becomes a 500 on every protected route. "0" is a valid
    # header that agrees with the empty body we actually send. Verified against
    # the live endpoint: no Content-Length -> 401, `Content-Length: 0` -> 401,
    # `Content-Length: 34` with no body -> tinyauth still answers 401 instantly
    # but nginx never reads it. ADR-0036.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "0";

    # INVARIANT: `include /config/nginx/proxy.conf;` MUST NOT be added to this
    # location, even though SWAG's own sample has it. proxy.conf sets BOTH the
    # X-Forwarded-* family AND X-Original-URL / X-Original-Method (the latter
    # for ingress-nginx-style auth backends). From tinyauth v5.2.0 a request
    # carrying two auth modules' header sets is denied outright:
    #   "Request carries headers for multiple auth modules, possible spoofing
    #    attempt, denying"  ->  400
    # nginx converts any non-2xx/401/403 subrequest into a 500, so the symptom
    # is EVERY protected route serving 500 while tinyauth is healthy and its
    # login page serves fine -- the door JAMMED SHUT (ADR-0034), not open.
    #
    # Measured from inside swag against the live endpoint:
    #   X-Forwarded-* only              -> 401   <- what auth_request needs
    #   X-Forwarded-* + X-Original-URL  -> 400   -> nginx 500 -> door shut
    #
    # Clearing them with `proxy_set_header X-Original-URL "";` does NOT work:
    # proxy.conf is included at this same level, so nginx emits its value too.
    # A header set by an include cannot be un-set beside it. Hence the explicit
    # minimal set below. `resolver.conf` above IS still required, for runtime
    # resolution of $upstream_tinyauth. ADR-0036.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header x-forwarded-proto $scheme;
    proxy_set_header x-forwarded-host $http_host;
    proxy_set_header x-forwarded-uri $request_uri;
}

# Where a 401 from the subrequest lands. nginx's auth_request cannot follow a
# 302 itself, so the redirect has to be issued here.
location @tinyauth_login {
    internal;

    ## Fallback, computed the way SWAG's sample does it -- host minus its first
    ## label, so any *.4eva.me route redirects to the same door.
    ##
    ## THE ONE DELIBERATE CHANGE from the upstream sample: `auth.`, not
    ## `tinyauth.`. The service is called tinyauth; the door is called auth.
    ## `make check` asserts this string agrees with TINYAUTH_APPURL, because two
    ## places naming the login page is exactly how a redirect loop happens.
    set_escape_uri $target_url $scheme://$http_host$request_uri;
    set $domain $host;
    if ($host ~* "^[^.]+\.([^.]+\..+)$") {
        set $domain $1;
    }
    set $signin_url https://auth.$domain/login?redirect_uri=$target_url;

    ## Preferred: tinyauth's own X-Tinyauth-Location header, which it derives
    ## from TINYAUTH_APPURL and which carries `login_for=app` as well as an
    ## already-escaped redirect_uri. Measured on v5.1.3: an unauthenticated
    ## /api/auth/nginx returns 401 with
    ##   X-Tinyauth-Location: https://auth.4eva.me/login?login_for=app&redirect_uri=...
    ## The fallback above stays because an empty $tinyauth_login_url would make
    ## `return 302` emit a header with no URL -- a 302 to nowhere, which is a
    ## broken door that still looks like a working one.
    if ($tinyauth_login_url != '') {
        set $signin_url $tinyauth_login_url;
    }

    return 302 $signin_url;
}
