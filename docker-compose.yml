# Docker Compose — Minisforum MS01 (32 GB RAM)
#
# Hardening kept:
# - security_opt: no-new-privileges
# - cap_drop: ALL + selective cap_add
# - 127.0.0.1 binds for internal-only ports
# - tmpfs for /tmp where supported
#
# Removed (Pi-era): mem_limit / mem_reservation / cpus / blkio_config / ulimit tuning.

networks:
  nas-network:
    name: nas-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'true'
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

services:
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - VALIDATION=dns
      - DNSPLUGIN=cloudflare
      - CF_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - URL=${PUBLIC_DOMAIN}
      - SUBDOMAINS=wildcard
      - ONLY_SUBDOMAINS=false
      - EMAIL=${ADMIN_EMAIL}
    volumes:
      - ${CONFIG_DIRECTORY}/swag:/config
      - ./webapps/4eva-rootpage/4eva-rootpage.root.conf:/config/nginx/site-confs/root.conf:ro
      - ./nginx-cache:/var/cache/nginx:rw
    ports:
      - '443:443'
      - '80:80'
    restart: unless-stopped
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      4eva-rootpage:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, 'https://localhost:443', -k]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - UMASK=022
    volumes:
      - ${CONFIG_DIRECTORY}/sonarr:/config
      - ${SHARE_DIRECTORY}/series:/tv
      - ${SHARE_DIRECTORY}/downloads:/downloads
      # 2026-09-01: single-mount view of the whole share, ADDED ALONGSIDE the
      # per-library mounts above rather than replacing them. Hardlinks cannot
      # cross a mount point even when both sides live on one filesystem, so with
      # /tv and /downloads as separate bind mounts every import silently fell
      # back to a full copy despite copyUsingHardlinks=True -- 0.96 TiB of
      # duplication. Under /data both trees share one mount, so link() works.
      # Verified by probe: `ln /downloads/... /tv/...` -> EXDEV,
      #                    `ln /data/downloads/... /data/series/...` -> ok.
      # The legacy mounts are kept deliberately: they make this reversible, and
      # removing them is a separate step once the new paths have bedded in.
      # See docs/arr-qbittorrent-pollution.md section 7.
      - ${SHARE_DIRECTORY}:/data
    ports:
      - '127.0.0.1:8989:8989'
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_started
      qbittorrent:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8989/ping']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - UMASK=022
    volumes:
      - ${CONFIG_DIRECTORY}/radarr:/config
      - ${SHARE_DIRECTORY}/movies:/movies
      - ${SHARE_DIRECTORY}/downloads:/downloads
      # 2026-09-01: single-mount view of the whole share, ADDED ALONGSIDE the
      # per-library mounts above rather than replacing them. Hardlinks cannot
      # cross a mount point even when both sides live on one filesystem, so with
      # /tv and /downloads as separate bind mounts every import silently fell
      # back to a full copy despite copyUsingHardlinks=True -- 0.96 TiB of
      # duplication. Under /data both trees share one mount, so link() works.
      # Verified by probe: `ln /downloads/... /tv/...` -> EXDEV,
      #                    `ln /data/downloads/... /data/series/...` -> ok.
      # The legacy mounts are kept deliberately: they make this reversible, and
      # removing them is a separate step once the new paths have bedded in.
      # See docs/arr-qbittorrent-pollution.md section 7.
      - ${SHARE_DIRECTORY}:/data
    ports:
      - '127.0.0.1:7878:7878'
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_started
      qbittorrent:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:7878/ping']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # slskd: no linuxserver image exists; official slskd/slskd is the standard image.
  # Runs as the host PUID:PGID so it can write to the shared volumes.
  # Plain nas-network member (VPN removed) — egress + Soulseek go over the home IP.
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    user: '${PUID:-1000}:${PGID:-1000}'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - nas-network
    ports:
      - '127.0.0.1:5030:5030' # slskd WebUI (behind SWAG)
      - '50300:50300/tcp' # Soulseek P2P inbound (forward on router)
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_DOWNLOADS_DIR=/downloads/complete/slskd
      - SLSKD_INCOMPLETE_DIR=/downloads/incomplete/slskd
      - SLSKD_SHARED_DIR=/music
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_API_KEY=${API_KEY_SLSKD}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_DIRECTORY}/slskd:/app
      - ${SHARE_DIRECTORY}/music:/music
      - ${SHARE_DIRECTORY}/downloads:/downloads
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true
    # Liveness-only healthcheck — deliberately Soulseek-INDEPENDENT (just spiders
    # the web UI). It must NOT probe isLoggedIn: slskd's Soulseek login drops
    # transiently (ghost session on slsknet after a fast restart, VPN blip), and
    # restarting on that is actively harmful — a restart re-collides with the
    # stale server-side session and perpetuates the 5000ms login-timeout spiral
    # (32->64->128s backoff). The only cure is to stay DOWN 15-30 min so slsknet
    # reaps its ghost session; an autoheal restart is the opposite of the cure.
    # So autoheal (label above) only restarts slskd if the web server itself is
    # dead. Login state is watched separately, alert-only, by
    # scripts/slskd_login_watch.py — which never restarts.
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://localhost:5030/']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly
    container_name: lidarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - UMASK=022
    volumes:
      - ${CONFIG_DIRECTORY}/lidarr:/config
      - ${SHARE_DIRECTORY}/music:/music
      - ${SHARE_DIRECTORY}/downloads:/downloads
      # 2026-09-01: single-mount view of the whole share, ADDED ALONGSIDE the
      # per-library mounts above rather than replacing them. Hardlinks cannot
      # cross a mount point even when both sides live on one filesystem, so with
      # /tv and /downloads as separate bind mounts every import silently fell
      # back to a full copy despite copyUsingHardlinks=True -- 0.96 TiB of
      # duplication. Under /data both trees share one mount, so link() works.
      # Verified by probe: `ln /downloads/... /tv/...` -> EXDEV,
      #                    `ln /data/downloads/... /data/series/...` -> ok.
      # The legacy mounts are kept deliberately: they make this reversible, and
      # removing them is a separate step once the new paths have bedded in.
      # See docs/arr-qbittorrent-pollution.md section 7.
      # 2026-09-01: STAGED BUT NOT IN USE for lidarr. The repath was attempted and
      # rolled back: Lidarr's `PUT /api/v1/artist/editor` with moveFiles=false wiped
      # TrackFiles (150,187 rows -> 0) where Sonarr/Radarr repathed cleanly. The DB
      # was restored from backup and lidarr's root folder is still /music, so it
      # still copies rather than hardlinks. This mount is left in place ready for a
      # safer retry -- see docs/arr-qbittorrent-pollution.md section X.
      - ${SHARE_DIRECTORY}:/data
    ports:
      - '127.0.0.1:8686:8686'
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_started
      qbittorrent:
        condition: service_started
      slskd:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8686/ping']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - UMASK=022
    volumes:
      - ${CONFIG_DIRECTORY}/bazarr:/config
      - ${SHARE_DIRECTORY}/movies:/movies
      - ${SHARE_DIRECTORY}/series:/tv
      - ${CONFIG_DIRECTORY}/subcleaner:/opt/subcleaner:ro
    ports:
      - '127.0.0.1:6767:6767'
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_started
      whisper:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:6767/ping']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # CPU-based Whisper ASR. On the MS01's Intel CPU, `small` transcribes ~5-10x real-time.
  # Upgrade to `medium` for better accuracy if you don't mind waiting longer per episode.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=small
      - ASR_DEVICE=cpu
      - ASR_MODEL_PATH=/models
    volumes:
      - ${CONFIG_DIRECTORY}/whisper:/models
    ports:
      - '127.0.0.1:9000:9000'
    restart: unless-stopped
    networks:
      - nas-network
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/docs']
      interval: 120s
      timeout: 15s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  lingarr:
    image: lingarr/lingarr:latest
    container_name: lingarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - ASPNETCORE_URLS=http://+:8080
      - MAX_CONCURRENT_JOBS=2
      - DB_CONNECTION=sqlite
    volumes:
      - ${CONFIG_DIRECTORY}/lingarr:/app/config
      - ${SHARE_DIRECTORY}/movies:/app/movies
      - ${SHARE_DIRECTORY}/series:/app/tv
    ports:
      - '127.0.0.1:9876:8080'
    restart: unless-stopped
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=INFO
    ports:
      - '127.0.0.1:8191:8191'
    restart: unless-stopped
    networks:
      - nas-network
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8191/docs']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_DIRECTORY}/prowlarr:/config
    ports:
      - '127.0.0.1:9696:9696'
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9696/ping']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  qbittorrent:
    # Pinned, not :latest. Floor is qBittorrent >= 5.2.2: 5.2.0/5.2.1 carry
    # upstream #24357, where the QLockFile lockfile records the container
    # hostname and a Docker recreate (which changes the hostname to the new
    # container ID) leaves qbit unable to prove the lock is stale, so it
    # refuses to start. Fixed by PR #24363 in 5.2.2. Pinning also keeps
    # watchtower from silently moving this container onto a regressed build
    # overnight -- see the note on labels below.
    # To update: bump this tag deliberately, then `docker compose up -d
    # qbittorrent` and watch it come back healthy before walking away.
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls473
    container_name: qbittorrent
    # Stable hostname across recreates. Belt-and-braces for #24357 above: even
    # on a fixed version this keeps the lockfile's hostname line meaningful, and
    # it is what the custom-init stale-lock check compares against.
    # NOTE: if qbittorrent is ever put behind a VPN sidecar via
    # `network_mode: service:<vpn>`, it inherits that container's network
    # namespace AND hostname -- pin the hostname on the VPN service instead,
    # because this line would then have no effect.
    hostname: qbittorrent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      # KILL is required, not optional. s6-overlay runs as root and has to
      # signal qbittorrent-nox, which runs as abc (uid 1000). Signalling a
      # process owned by a different uid needs CAP_KILL; without it the SIGTERM
      # is refused with EPERM, s6 never forwards the stop, and Docker SIGKILLs
      # at the end of stop_grace_period every single time. Measured on this box
      # 2026-09-01: without KILL `docker compose stop` took 120.3s and left the
      # lockfile + ipc-socket behind with no "Saving resume data completed";
      # with KILL it takes 6.2s, logs a clean shutdown, and qbit removes its own
      # lockfile. This was the actual root cause of the recurring crash/no-start
      # cycle -- the stale lockfile was only the symptom.
      # Verified minimal: KILL alone is sufficient. FOWNER/FSETID were NOT
      # needed and are deliberately not granted.
      - KILL
    networks:
      - nas-network
    ports:
      - '127.0.0.1:8080:8080' # qbittorrent WebUI (behind SWAG; scripts use loopback)
      - '6881:6881/tcp' # BitTorrent inbound (default; forward on router)
      - '6881:6881/udp'
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      # The LSIO image does not read QBITTORRENT_USER/QBITTORRENT_PASS -- they
      # were never wired up upstream (linuxserver/docker-qbittorrent#228, closed
      # as not planned) and passing them here only leaked the credentials into
      # `docker inspect`. They stay in .env because scripts/ still uses them to
      # authenticate against the WebUI API (qbittorrent_settings_enforce.py,
      # qbittorrent_stalled_kickstart.py, slskd_incomplete_sweep.py,
      # media_ops_status.py); they just have no business being in the container.
      - TORRENTING_PORT=6881
    volumes:
      - ${CONFIG_DIRECTORY}/qbittorrent:/config
      - ${SHARE_DIRECTORY}/downloads:/downloads
      # Self-heal: clears a *stale* single-instance lock at init so an ungraceful
      # kill can't trap qbit in an s6 crash loop. The script proves staleness
      # (0-byte pre-5.2.0 file, hostname mismatch, or dead PID) before deleting,
      # so a lock held by a live instance is preserved -- it is a backstop for
      # the CAP_KILL fix above, not a substitute for it.
      - ./qbittorrent/custom-cont-init.d:/custom-cont-init.d:ro
    # Headroom for flushing torrents.db + resume data. With CAP_KILL granted a
    # graceful stop measures ~6s at 128 torrents (2026-09-01), so this is now
    # generous headroom rather than a timeout that gets hit -- before CAP_KILL
    # every stop burned the full 120s and then got SIGKILLed anyway. Re-measure
    # with `time docker compose stop qbittorrent` if the torrent count grows a
    # lot; raise this only if the measured time approaches it.
    stop_grace_period: 120s
    restart: unless-stopped
    # 2026-09-01: scoped exception to the "no mem_limit on MS01" policy in the
    # header. libtorrent 2.x mmaps torrent data and the kernel keeps those pages
    # as page cache; with OS cache enabled this container's cgroup peaked at
    # 21.1GB (journalctl, container scope, 2026-09-01) and contributed to
    # host-wide OOM kills. The real fix is Session\DiskIOReadMode /
    # DiskIOWriteMode = DisableOSCache in qBittorrent.conf (set 2026-09-01);
    # this cap is the backstop if that is ever reverted through the WebUI.
    # Steady state is ~1.2GB, so 4g is ~3x headroom. memswap_limit == mem_limit
    # so it cannot balloon into host swap and thrash everything else first.
    mem_limit: 4g
    memswap_limit: 4g
    labels:
      # Deliberately NOT labelled for watchtower. The image tag above is pinned,
      # so there is nothing for watchtower to update, and its nightly
      # stop->remove->create cycle is what repeatedly broke this container:
      # on 2026-09-01 04:01 the remove failed ("tried to kill container, but did
      # not receive an exit event"), watchtower logged Failed=1 and moved on
      # WITHOUT creating a replacement, so qbittorrent simply ceased to exist
      # until a human noticed 13h later. restart: unless-stopped cannot help
      # with that -- there is no container left to restart. Updates are now a
      # deliberate tag bump (see image comment).
      - autoheal=true
    healthcheck:
      # GET / returns 200 unauthenticated on 5.2.3 (verified in-container
      # 2026-09-01), so `curl -f` is correct here -- the /api/v2/* endpoints
      # return 403 without a session and would flap the healthcheck. --max-time
      # bounds the request so a wedged WebUI fails the check instead of hanging
      # until the healthcheck timeout kills it.
      test: [CMD, curl, -f, --max-time, '10', 'http://localhost:8080/']
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # qui: modern web UI for qBittorrent (autobrr/qui). NOT a torrent client — it
  # has no BitTorrent engine and talks to the existing qBittorrent daemon over
  # its WebUI API at qbittorrent:8080 (a plain nas-network member), exactly
  # like the *arr clients.
  # No PUID/PGID support upstream, so the user is set directly. Config + SQLite
  # (qui.db) live in /config. Admin account and the qBittorrent instance are
  # created in the web UI on first run (qui cannot be seeded from env).
  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    user: '${PUID:-1000}:${PGID:-1000}'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ:-UTC}
      - QUI__HOST=0.0.0.0
      - QUI__PORT=7476
      - QUI__SESSION_SECRET=${QUI_SESSION_SECRET}
    volumes:
      - ${CONFIG_DIRECTORY}/qui:/config
    ports:
      - '127.0.0.1:7476:7476'
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
      - swag_port=7476
      - swag_proto=http
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://localhost:7476/']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # NOTE: Jellyfin volume mappings are NOT to be changed per owner's instructions
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL}
      # 2026-09-01: OpenCL tone-mapping mod tried and reverted (see
      # docs/jellyfin-playback-audit.md) — it needs CAP_FOWNER, which this
      # hardened container correctly doesn't grant, and nothing today
      # actually needs HDR tone-mapping. VPP tone-mapping is the path to use
      # if that ever changes (works today, no extra capabilities needed).
      # 2026-09-01: H3 test (glibc malloc arena fragmentation, matching
      # dotnet/runtime#122027 — native RSS growth while managed heap stays
      # flat, confirmed via heap dump in docs/jellyfin-playback-audit.md).
      # glibc sizes arenas from the host's online CPU count (16 here), not
      # the container's cgroup quota, so mem_limit alone can't restrain
      # this. Capping arena count trades allocator concurrency for memory;
      # A/B result before/after is in the audit doc. Revert: delete this line.
      - MALLOC_ARENA_MAX=2
      # 2026-09-01: W^X (write-xor-execute) A/B test for the memfd:doublemapper
      # native-memory contributor (dotnet/runtime#89776 / #121455), confirmed
      # present and growing independently of the arena cap above (docs/
      # jellyfin-playback-audit.md). Disables .NET's double-mapping of JIT'd
      # code (write-then-remap-executable) in favor of a single writable+
      # executable mapping. Real, if small, hardening tradeoff — acceptable
      # here: LAN-only media server behind SWAG, does not execute untrusted
      # code. A/B result recorded in the audit doc. Revert: delete this line.
      - DOTNET_EnableWriteXorExecute=0
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "991" # host 'render' GID, grants access to /dev/dri/renderD128 for QSV
    volumes:
      - ${CONFIG_DIRECTORY}/jellyfin:/config
      - ${SHARE_DIRECTORY}:/data/movies:ro
    ports:
      - '8096:8096'
      - '8920:8920'
      - '7359:7359/udp'
      - '1900:1900/udp'
    networks:
      - nas-network
    restart: unless-stopped
    # 2026-09-01: scoped exception to the "no mem_limit" policy above. Confirmed
    # via journalctl -k that the jellyfin process itself (not ffprobe/ffmpeg,
    # verified from the kernel's per-task RSS table) leaks to ~22-24GB anon-RSS
    # and gets killed by a *global* (host-wide) OOM-killer every ~2-12h, which
    # can take down unrelated containers' health checks as collateral. This is
    # a stopgap containing the blast radius while the leak itself is
    # root-caused, not a fix. See docs/jellyfin-playback-audit.md.
    # memswap_limit == mem_limit so it can't balloon into the host's swap and
    # thrash everything else before finally getting killed.
    mem_limit: 10g
    memswap_limit: 10g
    labels:
      - swag=enable
      # 2026-09-01: watchtower auto-update deliberately removed. Its
      # stop -> remove -> create cycle is NOT atomic: if the remove fails it
      # logs Failed=1 and moves on WITHOUT creating a replacement, leaving no
      # container at all. That is not hypothetical -- it happened to
      # qbittorrent on 2026-09-01 04:01 ("tried to kill container, but did not
      # receive an exit event"), which then simply did not exist for 13h until
      # a human noticed. restart: unless-stopped cannot help; there is nothing
      # left to restart. See docs/qbittorrent-crash-fix.md section F.
      # Jellyfin is the worst service in the stack to lose that way, and it is
      # also slow to stop, which is exactly the condition that makes the remove
      # time out. Updates are now a deliberate bump:
      #   docker compose pull jellyfin && docker compose up -d jellyfin
      # NOTE: this does not pin the tag, so an update still has to be chosen
      # rather than scheduled. If you want the qbittorrent treatment, pin the
      # image tag too.
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8096/System/Info/Public']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    init: true
    container_name: jellyseerr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=info
      - PORT=5056
    volumes:
      - ${CONFIG_DIRECTORY}/jellyseerr:/app/config
    ports:
      - '127.0.0.1:5056:5056'
    restart: unless-stopped
    depends_on:
      jellyfin:
        condition: service_started
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://localhost:5056/api/v1/status']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_DIRECTORY}/nextcloud:/config
      - ${SHARE_DIRECTORY}/nextcloud-data:/data
      - ${SHARE_DIRECTORY}:/external/drive:rw
      - ${SHARE_DIRECTORY}/movies:/external/movies:rw
      - ${SHARE_DIRECTORY}/series:/external/series:rw
      - ${SHARE_DIRECTORY}/music:/external/music:rw
      - ${SHARE_DIRECTORY}/books:/external/books:rw
      - ${SHARE_DIRECTORY}/downloads:/external/downloads:rw
    ports:
      - '127.0.0.1:8087:443'
    restart: unless-stopped
    depends_on:
      swag:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'https://localhost:443/status.php', -k]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: '3'

  lidarr-bulk:
    build:
      context: ./webapps/lidarr-bulk
    image: nas/lidarr-bulk:latest
    pull_policy: build
    container_name: lidarr-bulk
    # Locally-built image: Watchtower cannot pull, so opt-out.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint chowns /config then drops to `node` via su-exec; needs these
    # caps briefly during startup, app itself runs unprivileged afterwards.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - TZ=${TZ:-UTC}
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - LIDARR_URL=http://lidarr:8686
      - LIDARR_API_KEY=${API_KEY_LIDARR}
      - CONFIG_DIR=/config
      # Session login. When both username and password are set, the UI requires
      # login and /api/* requires either a valid session cookie or bearer token.
      - APP_USERNAME=${LIDARR_BULK_USERNAME:-}
      - APP_PASSWORD=${LIDARR_BULK_PASSWORD:-}
      # Optional bearer-token gate on /api/* (for programmatic clients).
      - APP_BEARER_TOKEN=${LIDARR_BULK_BEARER_TOKEN:-}
      # Optional — enables the AI "Discover" tab (GPT-suggested albums). Reuses
      # the same OPENAI_API_KEY as the playlist-generator. Tab hides if unset.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${LIDARR_BULK_OPENAI_MODEL:-gpt-4o}
      # Optional — enables the "Spotify" tab (queue albums from your playlists).
      # All three required; tab hides if any unset. Redirect URI is derived from
      # PUBLIC_DOMAIN and must be registered in the Spotify app dashboard.
      - SPOTIFY_API_CLIENT_ID=${SPOTIFY_API_CLIENT_ID:-}
      - SPOTIFY_API_CLIENT_SECRET=${SPOTIFY_API_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-https://lidarr-bulk.${PUBLIC_DOMAIN}/api/spotify/callback}
      # Optional — enables the per-playlist "Recreate in Jellyfin" button. Reuses
      # the stack's Jellyfin API key + user id; reachable in-network at :8096.
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${API_KEY_JELLYFIN}
      - JELLYFIN_USER_ID=${JELLYFIN_USER_ID}
      - RATE_LIMIT_PER_MINUTE=300
      - BODY_LIMIT_BYTES=262144
    volumes:
      - ${CONFIG_DIRECTORY}/lidarr-bulk:/config
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    depends_on:
      lidarr:
        condition: service_started
    networks:
      - nas-network
    labels:
      - swag=enable
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:3000/healthz']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # webapps/ongehoord — self-hosted PREVIEW of dipodidae/ongehoord-ui-content
  # (Nuxt 4 + @nuxt/content), pinned to the `dev` branch via the nested git
  # submodule at webapps/ongehoord/src. Upstream ships to Vercel with no
  # Dockerfile, so webapps/ongehoord/Dockerfile builds the nitro node-server
  # output. Locally built → unlabeled (Watchtower can't pull); update by pulling
  # the submodule and rebuilding. SWAG fronts it at ongehoord.${PUBLIC_DOMAIN}
  # with HTTP basic auth at the proxy layer (creds in webapps/ongehoord/.env →
  # /config/nginx/.htpasswd-ongehoord); the app itself has NO auth. App runtime
  # secrets (Vimeo/Maps/OpenAI/etc.) come from ~/nas/.env.ongehoord via env_file.
  # No host port: SWAG reaches it in-network at ongehoord:3000.
  ongehoord:
    build:
      context: ./webapps/ongehoord
    image: nas/ongehoord:latest
    pull_policy: build
    container_name: ongehoord
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ:-UTC}
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
    # App runtime secrets (NUXT_* tokens). Gitignored, user-managed.
    env_file:
      - ./.env.ongehoord
    restart: unless-stopped
    networks:
      - nas-network
    labels:
      - swag=enable
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:3000/nl']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - PORT=11011
    volumes:
      - ${CONFIG_DIRECTORY}/cleanuparr:/config
    ports:
      - '127.0.0.1:11011:11011'
    restart: unless-stopped
    depends_on:
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
      lidarr:
        condition: service_started
      qbittorrent:
        condition: service_healthy
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:11011/api/v1/health']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  recyclarr:
    image: recyclarr/recyclarr:8
    container_name: recyclarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ:-UTC}
      - CRON_SCHEDULE=0 4 * * *
      - DOCKER_UID=${PUID:-1000}
      - DOCKER_GID=${PGID:-1000}
    volumes:
      - ${CONFIG_DIRECTORY}/recyclarr:/config
    restart: unless-stopped
    depends_on:
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
    networks:
      - nas-network
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  4eva-rootpage:
    build:
      context: ./webapps/4eva-rootpage
    image: nas/4eva-rootpage:latest
    pull_policy: build
    container_name: 4eva-rootpage
    # Locally-built image: Watchtower cannot pull, so opt-out.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      # Live media-ops status JSON (refreshed by scripts/media_ops_status.py cron),
      # served at /ops-status.json for the /ops.html dashboard.
      - ${CONFIG_DIRECTORY}/ops-status/ops-status.json:/usr/share/nginx/html/ops-status.json:ro
    ports:
      - '127.0.0.1:8088:8080'
    restart: unless-stopped
    networks:
      - nas-network
    labels:
      - swag=enable
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://localhost:8080/healthz']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # PostgreSQL + pgvector backing store for playlist-generator. Internal only
  # (no host publish) — the app reaches it over nas-network. Data is persisted
  # under CONFIG_DIRECTORY like every other service. Left unlabeled for
  # Watchtower: never auto-update a database engine out from under its data.
  playlist-generator-db:
    image: pgvector/pgvector:pg16
    container_name: playlist-generator-db
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=playlist
      - POSTGRES_PASSWORD=${PLAYLIST_GENERATOR_DB_PASSWORD}
      - POSTGRES_DB=playlist_generator
    volumes:
      - ${CONFIG_DIRECTORY}/playlist-generator-db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nas-network
    healthcheck:
      test: [CMD-SHELL, pg_isready -U playlist -d playlist_generator]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # Jellyfin Playlist Generator — unified container (Nuxt static frontend +
  # FastAPI + nginx basic-auth, all on :80). Source is a git submodule at
  # webapps/jellyfin-playlist-generator (its own GitHub repo, pulled with
  # `git submodule update --remote`); the build uses the repo-root Dockerfile.
  # Locally-built: Watchtower can't pull, so it stays unlabeled. SWAG fronts it
  # at playlist-generator.4eva.me via the hand-managed proxy-conf; the app does
  # its own basic auth (AUTH_USER/AUTH_PASS -> htpasswd), so /health is the only
  # unauthenticated path. The library starts empty — index it in-container via
  # `docker exec playlist-generator python -m app.cli_v3 <step>`.
  # JELLYFIN_* wire the "Push to Jellyfin" export: the app reaches Jellyfin over
  # nas-network (jellyfin:8096) with API_KEY_JELLYFIN, and rewrites local track
  # paths (/music/...) to the path Jellyfin reports (Jellyfin mounts
  # ${SHARE_DIRECTORY} at /data/movies, so music lives at /data/movies/music).
  playlist-generator:
    build:
      context: ./webapps/jellyfin-playlist-generator
    image: nas/playlist-generator:latest
    pull_policy: build
    container_name: playlist-generator
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-UTC}
      - DATABASE_URL=postgresql://playlist:${PLAYLIST_GENERATOR_DB_PASSWORD}@playlist-generator-db:5432/playlist_generator
      - AUTH_USER=${PLAYLIST_GENERATOR_USERNAME:-admin}
      - AUTH_PASS=${PLAYLIST_GENERATOR_PASSWORD}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
      - DISCOGS_CONSUMER_KEY=${DISCOGS_CONSUMER_KEY:-}
      - DISCOGS_CONSUMER_SECRET=${DISCOGS_CONSUMER_SECRET:-}
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT:-}
      - MUSIC_DIRECTORIES=/music
      - M3U_OUTPUT_DIR=/playlists
      - SCAN_THREADS=${PLAYLIST_GENERATOR_SCAN_THREADS:-8}
      - EMBEDDING_MODEL_VERSION=1
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${API_KEY_JELLYFIN:-}
      - JELLYFIN_USER_ID=${JELLYFIN_USER_ID:-}
      - LOCAL_PATH_PREFIX=/music
      - JELLYFIN_PATH_PREFIX=/data/movies/music
    volumes:
      # RW (was :ro) so the in-app "Fix Jellyfin release dates" button can write
      # durable album.nfo sidecars (year + <lockdata>) into album folders. Only the
      # date-fixer writes here. NOTE: this is the playlist-generator's music mount,
      # NOT Jellyfin's ${SHARE_DIRECTORY}:/data/movies:ro (that stays read-only).
      - ${SHARE_DIRECTORY}/music:/music
      - ${SHARE_DIRECTORY}/playlists:/playlists
    restart: unless-stopped
    depends_on:
      playlist-generator-db:
        condition: service_healthy
    networks:
      - nas-network
    labels:
      - swag=enable
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # Read-only Docker API proxy. Exposes only the endpoints Watchtower needs
  # (containers/images/networks/ping/version + POST/DELETE) so Watchtower never
  # touches /var/run/docker.sock directly. Only reachable inside nas-network.
  # NETWORKS=1 is required for Watchtower to disconnect/reconnect containers
  # on the custom nas-network during the recreate flow.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - PING=1
      - VERSION=1
      - INFO=1
      - POST=1
      - DELETE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    restart: unless-stopped
    networks:
      - nas-network
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # Watches containers labeled com.centurylinklabs.watchtower.enable=true and
  # pulls newer images on the schedule defined by WATCHTOWER_SCHEDULE.
  # Talks to Docker through `dockerproxy`, not the raw socket.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ:-UTC}
      - DOCKER_HOST=tcp://dockerproxy:2375
      - DOCKER_API_VERSION=1.40
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=false
      - WATCHTOWER_REMOVE_VOLUMES=false
      # Watchtower's own SIGTERM->SIGKILL timeout is separate from compose's
      # stop_grace_period and defaults to 10s, which is too short for qbittorrent
      # to flush torrents.db (needs up to 120s). A too-short timeout here caused
      # Watchtower to force-kill qbittorrent mid-shutdown on 2026-08-19, hit a
      # docker/containerd race, and leave the container dead for 7 days with no
      # auto-recovery. Match the longest stop_grace_period in the stack.
      - WATCHTOWER_TIMEOUT=150s
      # 2026-09-01: push image updates and failures to ntfy via shoutrrr.
      # Watchtower is the one thing here that changes containers on its own, so
      # "what changed at 04:00 and did it work" should not require reading logs.
      # `disabletitle=no` keeps shoutrrr's own title; the URL carries the
      # write-only `arr` credential. WATCHTOWER_NOTIFICATION_REPORT=true sends
      # one digest per run instead of a message per container.
      - WATCHTOWER_NOTIFICATION_URL=ntfy://${NTFY_ARR_USER}:${NTFY_ARR_PASSWORD}@ntfy:8410/nas-alerts?scheme=http&priority=default&tags=package
      - WATCHTOWER_NOTIFICATION_REPORT=true
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
    depends_on:
      dockerproxy:
        condition: service_started
    restart: unless-stopped
    networks:
      - nas-network
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # Restarts containers labeled `autoheal=true` when Docker marks them unhealthy.
  # Used for slskd, whose Soulseek login can drop while its web server stays up
  # (see slskd's login-aware healthcheck). Talks to Docker through `dockerproxy`
  # over TCP (DOCKER_SOCK=tcp://...), never the raw socket — same rule as
  # watchtower. dockerproxy already exposes CONTAINERS + POST, all autoheal needs.
  # Left unlabeled for watchtower, like the other control-plane containers.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - TZ=${TZ:-UTC}
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      # 2026-09-01: autoheal's restart uses its OWN stop timeout, which defaults
      # to 10s and ignores compose's stop_grace_period entirely -- the same trap
      # that WATCHTOWER_TIMEOUT above exists to close. qbittorrent needs up to
      # 120s to flush torrents.db; a 10s SIGTERM->SIGKILL is precisely the
      # ungraceful kill that leaves the stale lockfile documented in AGENTS.md.
      # autoheal supervises qbittorrent and slskd, so match the longest
      # stop_grace_period in the stack (120s) with headroom.
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=150
      - DOCKER_SOCK=tcp://dockerproxy:2375
      # Must exceed AUTOHEAL_DEFAULT_STOP_TIMEOUT above. autoheal's restart call
      # blocks for the whole stop timeout, so a shorter curl timeout makes it log
      # "Restarting container ... failed" and re-issue the restart every
      # AUTOHEAL_INTERVAL while the first one is still in flight -- verified
      # 2026-09-01 with a deliberately-unhealthy probe: the restart succeeded at
      # exactly t+150s while autoheal had already logged three failures and fired
      # three overlapping requests. For qbittorrent (stop_grace_period 120s) that
      # is precisely the pile-up that leaves a stale lockfile.
      - CURL_TIMEOUT=180
    depends_on:
      dockerproxy:
        condition: service_started
    restart: unless-stopped
    networks:
      - nas-network
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'

  # 2026-09-01: push notifications for scripts/stack_watchdog.py. Added because
  # nothing on this box reported failure — Jellyfin was OOM-killed five times in
  # 48h and qBittorrent sat dead for 14h, both found by accident (see
  # docs/jellyfin-playback-audit.md). ntfy over Gotify: a single unauthenticated-
  # shaped `POST <topic-url>` with a text body is the whole publish contract, it
  # needs no server-side application/token setup before the first alert can land,
  # and this repo already speaks it (SLSKD_ALERT_WEBHOOK in slskd_login_watch.py).
  # Self-hosted rather than ntfy.sh so alert contents never leave the box; the
  # watchdog publishes over loopback and only the phone's subscription goes out
  # through SWAG. Note the coverage limit this implies: the watchdog and ntfy run
  # on the same host, so neither can tell you the *host itself* is down — that
  # needs an off-box heartbeat, deliberately not built here.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: ['serve']
    # No LSIO root init to chown /var/lib/ntfy — same gotcha as `qui`. The host
    # dir must already be ${PUID}:${PGID} or ntfy crash-loops on first start:
    #   mkdir -p ${CONFIG_DIRECTORY}/ntfy && chown ${PUID}:${PGID} $_
    user: '${PUID:-1000}:${PGID:-1000}'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ:-UTC}
      # Non-root can't bind :80, so ntfy listens high and SWAG proxies to it.
      - NTFY_LISTEN_HTTP=:8410
      - NTFY_BASE_URL=https://ntfy.${PUBLIC_DOMAIN}
      - NTFY_BEHIND_PROXY=true
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      # deny-all: a topic on a public subdomain is otherwise world-readable to
      # anyone who guesses its name. Access is granted per-user (see README).
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_SIGNUP=false
      # Cache so an alert raised while the phone is offline is still delivered
      # on reconnect instead of being silently dropped.
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_CACHE_DURATION=48h
      # Without this the web UI cannot authenticate at all, which on a
      # deny-all server means ntfy.${PUBLIC_DOMAIN} is a login page you can
      # never get past. Signup stays off — accounts are created by hand.
      - NTFY_ENABLE_LOGIN=true
      # Web Push: lets a browser notify with no ntfy tab open. Needs the VAPID
      # keypair from `docker exec ntfy ntfy webpush keys` (kept in .env —
      # regenerating them invalidates every existing browser subscription) and
      # a contact address, which is what browser push services require of the
      # server operator. Android does NOT use any of this; the app holds its
      # own connection to this server.
      - NTFY_WEB_PUSH_PUBLIC_KEY=${NTFY_WEB_PUSH_PUBLIC_KEY}
      - NTFY_WEB_PUSH_PRIVATE_KEY=${NTFY_WEB_PUSH_PRIVATE_KEY}
      - NTFY_WEB_PUSH_FILE=/var/lib/ntfy/webpush.db
      - NTFY_WEB_PUSH_EMAIL_ADDRESS=${ADMIN_EMAIL}
      # Deliberately NOT set: NTFY_UPSTREAM_BASE_URL. That exists only so iOS
      # devices can be woken via ntfy.sh's APNs relay, and it would send a hash
      # of every topic to ntfy.sh. Android needs no relay, so nothing about
      # these alerts leaves the box.
    volumes:
      - ${CONFIG_DIRECTORY}/ntfy:/var/lib/ntfy
    ports:
      - '127.0.0.1:8410:8410' # publish/subscribe from host cron; public side is SWAG
    restart: unless-stopped
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://localhost:8410/v1/health | grep -q ''"healthy":true''']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
