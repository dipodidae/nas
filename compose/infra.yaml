# Control plane: TLS termination, the Docker-API proxy, the two supervisors
# that use it, and push alerting.
#
# Blast radius: everything. dockerproxy is the only container in the stack with
# any route to the Docker socket (ADR-0013), and both watchtower and autoheal
# depend on it.

services:

  swag:
    extends:
      file: _fragments.yaml
      service: svc-lsio-env
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    # NET_BIND_SERVICE first, then the LSIO set -- declared locally rather than
    # inherited from svc-lsio so the on-disk capability order is unchanged.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      # INVARIANT: nginx's master is root and its workers run as uid 1000
      # (`user abc;`). kill() across a uid boundary needs CAP_KILL -- root is
      # not enough. Without it `nginx -s reload` leaks stale-config workers and
      # a graceful stop ends in SIGKILL. Verified by probe: kill -0 against a
      # worker returned EPERM on 2026-09-02. ADR-0021.
      - KILL
    environment:
      - VALIDATION=dns
      - DNSPLUGIN=cloudflare
      - CF_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - URL=${PUBLIC_DOMAIN}
      - SUBDOMAINS=wildcard
      - ONLY_SUBDOMAINS=false
      - EMAIL=${ADMIN_EMAIL}
    volumes:
      - ${CONFIG_DIRECTORY}/swag:/config
      # Paths are relative to THIS file (compose/), hence the ../ -- see
      # docs/decisions/0000-compose-layout.md.
      - ../webapps/4eva-rootpage/4eva-rootpage.root.conf:/config/nginx/site-confs/root.conf:ro
      # INVARIANT: every enabled proxy-conf is TRACKED HERE and mounted read-only,
      # not left to live in gitignored ${CONFIG_DIRECTORY}/swag where the nightly
      # backup is the only thing keeping it. Six of these have no upstream sample
      # at all (cleanuparr, lidarr-bulk, lingarr, ongehoord, playlist-generator,
      # slskd) and three carry heavy local edits (ntfy 56 lines, jellyfin 22,
      # jellyseerr 2) -- losing the config dir would mean reconstructing them from
      # memory. `make check` asserts the set. ADR-0022.
      #
      # Mounted file-by-file rather than as a directory ON PURPOSE: SWAG writes
      # 372 *.conf.sample files into /config/nginx/proxy-confs at every start, so
      # a read-only mount over the whole directory breaks its startup.
      - ../swag/proxy-confs/bazarr.subdomain.conf:/config/nginx/proxy-confs/bazarr.subdomain.conf:ro
      - ../swag/proxy-confs/cleanuparr.subdomain.conf:/config/nginx/proxy-confs/cleanuparr.subdomain.conf:ro
      - ../swag/proxy-confs/jellyfin.subdomain.conf:/config/nginx/proxy-confs/jellyfin.subdomain.conf:ro
      - ../swag/proxy-confs/jellyseerr.subdomain.conf:/config/nginx/proxy-confs/jellyseerr.subdomain.conf:ro
      - ../swag/proxy-confs/lidarr-bulk.subdomain.conf:/config/nginx/proxy-confs/lidarr-bulk.subdomain.conf:ro
      - ../swag/proxy-confs/lidarr.subdomain.conf:/config/nginx/proxy-confs/lidarr.subdomain.conf:ro
      - ../swag/proxy-confs/lingarr.subdomain.conf:/config/nginx/proxy-confs/lingarr.subdomain.conf:ro
      - ../swag/proxy-confs/nextcloud.subdomain.conf:/config/nginx/proxy-confs/nextcloud.subdomain.conf:ro
      - ../swag/proxy-confs/ntfy.subdomain.conf:/config/nginx/proxy-confs/ntfy.subdomain.conf:ro
      - ../swag/proxy-confs/ongehoord.subdomain.conf:/config/nginx/proxy-confs/ongehoord.subdomain.conf:ro
      - ../swag/proxy-confs/playlist-generator.subdomain.conf:/config/nginx/proxy-confs/playlist-generator.subdomain.conf:ro
      - ../swag/proxy-confs/prowlarr.subdomain.conf:/config/nginx/proxy-confs/prowlarr.subdomain.conf:ro
      - ../swag/proxy-confs/qui.subdomain.conf:/config/nginx/proxy-confs/qui.subdomain.conf:ro
      - ../swag/proxy-confs/radarr.subdomain.conf:/config/nginx/proxy-confs/radarr.subdomain.conf:ro
      - ../swag/proxy-confs/slskd.subdomain.conf:/config/nginx/proxy-confs/slskd.subdomain.conf:ro
      - ../swag/proxy-confs/sonarr.subdomain.conf:/config/nginx/proxy-confs/sonarr.subdomain.conf:ro
      - ../nginx-cache:/var/cache/nginx:rw
    ports:
      - '443:443'
      - '80:80'
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      4eva-rootpage:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, 'https://localhost:443', -k]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Read-only Docker API proxy. INVARIANT: the only container in this stack
  # permitted to mount /var/run/docker.sock. Exposes just the endpoints
  # watchtower and autoheal need; NETWORKS=1 is required so watchtower can
  # disconnect/reconnect containers on nas-network during a recreate.
  # ADR-0013.
  dockerproxy:
    extends:
      file: _fragments.yaml
      service: svc-hardened
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - PING=1
      - VERSION=1
      - INFO=1
      - POST=1
      - DELETE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - nas-network
    healthcheck:
      disable: true
    # Watchtower-opt-out: it must not restart its own dependency. ADR-0006.

  # SMART monitoring with historical trending. Scrutiny is the ONLY container in
  # this stack that holds CAP_SYS_ADMIN or any raw device, so it is a deliberate,
  # scoped exception to the cap_drop: ALL baseline of ADR-0001. ADR-0023.
  #
  # Coverage is ONE device, and that is not a configuration mistake: the 9.1 TB
  # USB disk holding ${SHARE_DIRECTORY} passes no SMART under any `smartctl -d`
  # type, verified again 2026-09-02 across sat/sat,12/sat,16/usbjmicron/
  # usbsunplus/usbcypress/scsi -- and it stays unreadable from inside this
  # container even with SYS_RAWIO added and /dev/sda passed in. A GREEN SCRUTINY
  # DASHBOARD IS NOT COVERAGE OF THE MEDIA DISK. That disk's channels are
  # scripts/stack_watchdog.py's kernel-log sweep and ext4 superblock counter.
  scrutiny:
    extends:
      file: _fragments.yaml
      service: svc-hardened-tz
    # INVARIANT: pinned. The omnibus image bundles InfluxDB, and an unattended
    # engine bump under a live TSDB is the failure playlist-generator-db is
    # opted out of for the same reason. ADR-0023.
    image: ghcr.io/analogj/scrutiny:v0.9.3-omnibus
    container_name: scrutiny
    cap_add:
      # INVARIANT: SYS_ADMIN and nothing else. Measured 2026-09-02, not copied
      # from the upstream example -- which asks for SYS_RAWIO plus SYS_ADMIN:
      #   SYS_RAWIO alone  -> NVME_IOCTL_ADMIN_CMD: Permission denied
      #   SYS_ADMIN alone  -> full attributes, PASSED
      #   both together    -> no better than SYS_ADMIN alone
      # so SYS_RAWIO is redundant here and is deliberately NOT granted. Same
      # discipline as ADR-0004: do not widen a grant that measurement says is
      # already sufficient.
      - SYS_ADMIN
    devices:
      # INVARIANT: the NVMe CONTROLLER char device, not the namespace block
      # device. `smartctl --scan` enumerates /dev/nvme[0-9]+ and returns EMPTY
      # when only /dev/nvme0n1 is passed, so the collector would find no disks
      # at all -- and it would look like a working install. Measured 2026-09-02.
      # /dev/sda is deliberately NOT passed: it answers nothing (see above), so
      # granting raw access to the data-bearing disk would buy zero telemetry.
      #
      # `:r` rather than the default `rwm`, because measurement says read is
      # enough. It blocks write(2) to the node. It is NOT claimed to block NVMe
      # admin-command ioctls -- CAP_SYS_ADMIN permits those by design, and that
      # residual is the actual price of this exception. ADR-0023 states it.
      - /dev/nvme0:/dev/nvme0:r
    environment:
      # Daily. Clear of the 05:05 Jellyfin library scans and the 05:30 slskd
      # import pass; SMART collection is cheap but the wear curve only needs
      # one point a day.
      - COLLECTOR_CRON_SCHEDULE=45 5 * * *
      # ADR-0012: everything lands on the one ntfy topic. Reuses the existing
      # write-only container publisher rather than minting a fourth account --
      # scrutiny is less externally exposed than the *arrs that share it, and a
      # per-publisher account with no distinct trust boundary is churn.
      - SCRUTINY_NOTIFY_URLS=ntfy://${NTFY_ARR_USER}:${NTFY_ARR_PASSWORD}@ntfy:8410/nas-alerts?scheme=http&priority=high&tags=floppy_disk
    volumes:
      - ${CONFIG_DIRECTORY}/scrutiny/config:/opt/scrutiny/config
      - ${CONFIG_DIRECTORY}/scrutiny/influxdb:/opt/scrutiny/influxdb
      # Device metadata (model/serial/WWN) so a disk keeps its identity in the
      # history across a rescan.
      - /run/udev:/run/udev:ro
    ports:
      # INVARIANT: host 8086, not 8080. Scrutiny serves on 8080 inside, and
      # qbittorrent already owns 127.0.0.1:8080 on the host -- which scripts/
      # depend on via qbit's localhost auth-bypass. ADR-0014.
      - '127.0.0.1:8086:8080'
    networks:
      - nas-network
    # No labels on purpose, and all three omissions are deliberate:
    #   * no swag=enable / proxy-conf -- this adds no public surface. Reach it
    #     over an SSH tunnel to 127.0.0.1:8086, like the *arr WebUIs.
    #   * no autoheal=true -- a restart cannot fix a failing disk, and the probe
    #     would be the only thing standing between a wedged TSDB and a restart
    #     loop. ADR-0009's rule applies to new services too.
    #   * no watchtower label -- it is on the documented WATCHTOWER_OPTOUT list
    #     in scripts/check-invariants.sh instead. ADR-0023.
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8080/api/health']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s

  # DETECTS newer images for containers labelled
  # com.centurylinklabs.watchtower.enable=true, on WATCHTOWER_SCHEDULE, and
  # reports them to ntfy. It does NOT apply them -- see WATCHTOWER_MONITOR_ONLY
  # below. Reaches Docker only through dockerproxy. ADR-0020 supersedes the
  # per-service opt-out defence in ADR-0006.
  watchtower:
    extends:
      file: _fragments.yaml
      service: svc-hardened-tz
    # INVARIANT: NOT containrrr/watchtower -- archived 2025-12-17, "no longer
    # maintained". This fork keeps the com.centurylinklabs.watchtower.* labels
    # and the WATCHTOWER_* env contract, so every label in this repo and every
    # deliberate omission keeps its meaning. ADR-0020.
    image: nickfedor/watchtower:1.22.0
    container_name: watchtower
    environment:
      - DOCKER_HOST=tcp://dockerproxy:2375
      # DOCKER_API_VERSION removed with the fork swap: it autonegotiates, and
      # this host serves API 1.55. ADR-0020.
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      - WATCHTOWER_LABEL_ENABLE=true
      # Inert under monitor-only (cleanup only removes an image AFTER a
      # container is restarted with a new one), left set so it is correct again
      # if anyone reverts. The weekly `docker image prune -f` cron is what
      # actually bounds the images monitor-only keeps pulling. ADR-0020.
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=false
      - WATCHTOWER_REMOVE_VOLUMES=false
      # INVARIANT: monitor-only. Watchtower detects updates and reports them;
      # it must never stop, remove or create a container. Its recreate is not
      # atomic and a failed remove leaves NO container at all -- 13h of
      # qbittorrent on 2026-09-01, 7 days on 2026-08-19. It did recreate `qui`
      # at 04:01 on 2026-09-02, so this capability is live, not historical.
      # Recreating is `docker compose up -d`'s job. ADR-0020.
      - WATCHTOWER_MONITOR_ONLY=true
      # INVARIANT: >= the longest stop_grace_period in the stack (qbittorrent,
      # 120s). Watchtower's own SIGTERM->SIGKILL timeout defaults to 10s and
      # ignores compose's stop_grace_period. ADR-0006.
      - WATCHTOWER_TIMEOUT=150s
      # One ntfy digest per run, so "what changed at 04:00" needs no log
      # reading. ADR-0012.
      - WATCHTOWER_NOTIFICATION_URL=ntfy://${NTFY_ARR_USER}:${NTFY_ARR_PASSWORD}@ntfy:8410/nas-alerts?scheme=http&priority=default&tags=package
      - WATCHTOWER_NOTIFICATION_REPORT=true
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
    depends_on:
      dockerproxy:
        condition: service_started
    networks:
      - nas-network
    healthcheck:
      disable: true
    # Watchtower-opt-out: never self-update. ADR-0006.

  # Version-aware update NOTIFICATION. This is the tool that closes the gap
  # ADR-0020 named and could not close: watchtower reports against the tag a
  # container was STARTED FROM, so a pinned tag is silent and an unlabelled one
  # is never checked -- which meant `jellyfin` and `qbittorrent`, the two whose
  # updates most need to be chosen deliberately, got no notification at all.
  #
  # Diun's FILE provider watches a repository and enumerates its tags, so a pin
  # is visible. That is the whole reason it is the file provider and not the
  # docker provider: the docker provider would reproduce watchtower's blind spot
  # exactly. ADR-0024.
  #
  # It notifies. It has no route to the Docker API at all -- not even through
  # dockerproxy -- because it never needs to touch a container. Applying an
  # update stays `docker compose pull <svc> && docker compose up -d <svc>`.
  diun:
    extends:
      file: _fragments.yaml
      service: svc-hardened-tz
    # INVARIANT: pinned. The thing that tells you about updates should not take
    # one by surprise; it watches its own repository via the manifest, so a new
    # Diun shows up as a notification like everything else. ADR-0024.
    image: crazymax/diun:4.33.0
    container_name: diun
    # INVARIANT: no LSIO root init, so ${CONFIG_DIRECTORY}/diun must already be
    # ${PUID}:${PGID} or the bbolt DB cannot be created. Same gotcha as qui and
    # ntfy; `make bootstrap` does it. ADR-0014.
    user: '${PUID:-1000}:${PGID:-1000}'
    environment:
      - DIUN_DB_PATH=/data/diun.db
      # 04:10, twenty past what watchtower used to occupy, so "what changed
      # overnight" stays one glance at one topic.
      - DIUN_WATCH_SCHEDULE=10 4 * * *
      # INVARIANT: both of these together, or the first run is a spam event.
      # RUNONSTARTUP makes the DB exist within a minute of a cold start (which
      # the healthcheck below depends on); FIRSTCHECKNOTIF=false stops that run
      # announcing all 23 images as "new". Persisting /data is the other half:
      # without it every restart is a first run again. ADR-0024.
      - DIUN_WATCH_RUNONSTARTUP=true
      - DIUN_WATCH_FIRSTCHECKNOTIF=false
      # Report a moving tag whose digest changed underneath it -- the signal
      # watchtower gave for the 16 labelled services, minus the ability to act.
      - DIUN_WATCH_COMPAREDIGEST=true
      # Generated from the compose model; `make check` asserts it is current.
      - DIUN_PROVIDERS_FILE_FILENAME=/manifest.yml
      # ADR-0012: one topic. Diun's native ntfy notifier accepts a TOKEN only,
      # not basic auth -- so this is a third answer to the "some services cannot
      # set an auth header" problem in AGENTS.md, alongside ?auth= and URL
      # userinfo. The token belongs to the existing write-only `arr` publisher,
      # so it can be revoked without touching that account's password:
      #   docker exec ntfy ntfy token remove arr <token>
      - DIUN_NOTIF_NTFY_ENDPOINT=http://ntfy:8410
      - DIUN_NOTIF_NTFY_TOPIC=nas-alerts
      - DIUN_NOTIF_NTFY_TOKEN=${NTFY_DIUN_TOKEN}
      - DIUN_NOTIF_NTFY_PRIORITY=3
      - DIUN_NOTIF_NTFY_TAGS=package
      - DIUN_LOG_LEVEL=info
    volumes:
      - ${CONFIG_DIRECTORY}/diun:/data
      # Tracked in-repo and mounted read-only, for the same reason the SWAG
      # proxy-confs are (ADR-0022): a notification config that lives only in the
      # gitignored config dir drifts silently, and nothing tells you the thing
      # meant to tell you has stopped covering something.
      - ../diun/manifest.yml:/manifest.yml:ro
    depends_on:
      ntfy:
        condition: service_started
    networks:
      - nas-network
    # No ports and no swag=enable: Diun has no HTTP server at all. Nothing to
    # publish, nothing to route. No autoheal label either -- see ADR-0009; a
    # daily notifier is not worth an auto-restart path.
    #
    # It is on the documented WATCHTOWER_OPTOUT list in
    # scripts/check-invariants.sh rather than labelled, and commit 3 retires
    # watchtower entirely. ADR-0024, ADR-0025.
    healthcheck:
      # Diun exposes no liveness endpoint, so this asserts the thing that
      # actually matters for a scheduled checker: that it has WRITTEN to its
      # database recently. 48h is two schedule periods -- a checker that has
      # silently stopped checking is the failure mode, and "the process is
      # alive" would not catch it. Valid from a cold start only because
      # RUNONSTARTUP populates the DB immediately.
      #
      # `stat -c %Y` rather than `find -newermt`: this is a busybox image and
      # -newermt is NOT supported there (measured -- it fails silently, which
      # would have made this healthcheck always-green).
      test: [CMD-SHELL, '[ $$(( $$(date +%s) - $$(stat -c %Y /data/diun.db) )) -lt 172800 ]']
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 120s

  # Restarts containers labelled `autoheal=true` (qbittorrent, slskd) when
  # Docker marks them unhealthy. Reaches Docker only through dockerproxy.
  # NOTE: slskd's healthcheck is deliberately Soulseek-INDEPENDENT, so autoheal
  # restarts slskd only if its web server itself dies -- never for a dropped
  # Soulseek login, which a restart makes strictly worse. ADR-0009.
  autoheal:
    extends:
      file: _fragments.yaml
      service: svc-hardened-tz
    image: willfarrell/autoheal:latest
    container_name: autoheal
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      # INVARIANT: stop timeout >= the longest stop_grace_period in the stack
      # (120s), and CURL_TIMEOUT > that stop timeout. autoheal uses its own
      # stop timeout (default 10s) and its restart call blocks for the whole
      # of it. ADR-0010.
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=150
      - DOCKER_SOCK=tcp://dockerproxy:2375
      - CURL_TIMEOUT=180
    depends_on:
      dockerproxy:
        condition: service_started
    networks:
      - nas-network
    healthcheck:
      disable: true
    # Watchtower-opt-out: control plane. ADR-0006.

  # Push alerting for scripts/stack_watchdog.py and watchtower. Self-hosted so
  # alert contents never leave the box; deny-all because the topic sits on a
  # public subdomain. Coverage limit: the watchdog and ntfy share this host, so
  # neither can report the host itself being down. ADR-0012.
  ntfy:
    extends:
      file: _fragments.yaml
      service: svc-hardened-tz
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: [serve]
    # INVARIANT: no LSIO root init here, so ${CONFIG_DIRECTORY}/ntfy must
    # already be ${PUID}:${PGID} or ntfy crash-loops on first start. Same
    # gotcha as `qui`. `make bootstrap` does this. ADR-0014.
    user: '${PUID:-1000}:${PGID:-1000}'
    environment:
      # Non-root cannot bind :80, so ntfy listens high and SWAG proxies to it.
      - NTFY_LISTEN_HTTP=:8410
      - NTFY_BASE_URL=https://ntfy.${PUBLIC_DOMAIN}
      - NTFY_BEHIND_PROXY=true
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_SIGNUP=false
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_CACHE_DURATION=48h
      - NTFY_ENABLE_LOGIN=true
      # Regenerating this keypair invalidates every existing browser
      # subscription. ADR-0012.
      - NTFY_WEB_PUSH_PUBLIC_KEY=${NTFY_WEB_PUSH_PUBLIC_KEY}
      - NTFY_WEB_PUSH_PRIVATE_KEY=${NTFY_WEB_PUSH_PRIVATE_KEY}
      - NTFY_WEB_PUSH_FILE=/var/lib/ntfy/webpush.db
      - NTFY_WEB_PUSH_EMAIL_ADDRESS=${ADMIN_EMAIL}
      # Deliberately NOT set: NTFY_UPSTREAM_BASE_URL (would send a hash of
      # every topic to ntfy.sh; only iOS needs that relay). ADR-0012.
    volumes:
      - ${CONFIG_DIRECTORY}/ntfy:/var/lib/ntfy
    ports:
      - '127.0.0.1:8410:8410' # publish/subscribe from host cron; public side is SWAG
    networks:
      - nas-network
    labels:
      - swag=enable
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://localhost:8410/v1/health | grep -q ''"healthy":true''']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
