  modes:
    search: [q]
    book-search: [q]

settings: []

download:
  headers:
    User-Agent: ["Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0"]
  infohash:
    hash:
      selector: td:contains("Info Hash:") ~ td
      filters:
        - name: regexp
          args: ([A-Fa-f0-9]{40})
    title:
      selector: h1
      filters:
        - name: trim
        - name: validfilename

search:
  # INVARIANT: a browser User-Agent on search AND download. ABB answers
  # Prowlarr's own UA ("Prowlarr/2.5...") with a 146-byte 404 on every page,
  # so the definition looks broken while the site is fine. Measured 2026-09-27.
  headers:
    User-Agent: ["Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0"]
  # INVARIANT: lowercase, punctuation-free keywords. ABB 301s ANY query with an
  # uppercase letter to its homepage (`?s=Murakami` redirects, `?s=murakami`
  # answers), and Prowlarr counts the redirect as an indexer failure -- so every
  # search the *arrs make, which are always Title Cased, failed. Measured.
  keywordsfilters:
    - name: tolower
    - name: re_replace
      args: ["[^a-z0-9 ]+", " "]
    - name: trim
  paths:
    # 7-9 results a page. TWO pages, not the original's five: every *arr query
    # is a specific "title author", which the first page answers, and each page
    # is a request -- five per book across a 200-book backlog is how a public
    # site gets an IP blocked. Prowlarr also caps this indexer at 60 queries/h.
    - path: "{{ if .Keywords }}?s={{ .Keywords }}{{ else }}{{ end }}"
    - path: "page/2/{{ if .Keywords }}?s={{ .Keywords }}{{ else }}{{ end }}"

  # INVARIANT: English and Dutch posts only. The *arrs have no release-level
  # language filter, and ABB carries many translations under the same title --
  # the top hit for "Norwegian Wood" was the Spanish "Tokio blues" M4B, which
  # Bookshelf approved. ABB states the language in every post, so drop the rest
  # here, where it is still known.
  rows:
    selector: 'div.post:has(div[class="postTitle"]):has(div.postInfo:contains("Language: English")), div.post:has(div[class="postTitle"]):has(div.postInfo:contains("Language: Dutch"))'

  fields:
    category:
      selector: div.postInfo
      filters:
        - name: regexp
          args: "Category: (.+?)\\s"
    title_raw:
      selector: div.postTitle
    format:
      optional: true
      selector: div.postContent
      filters:
        - name: regexp
          args: "Format: ([A-Za-z0-9]+)"
    title:
      text: "{{ .Result.title_raw }}{{ if .Result.format }} [{{ .Result.format }}]{{ else }}{{ end }}"
    details:
      selector: div.postTitle h2 a
      attribute: href
    download:
      selector: div.postTitle h2 a
      attribute: href
    poster:
      optional: true
      selector: img
      attribute: src
    date_optional:
      optional: true
      selector: div.postContent
      filters:
        - name: regexp
          args: "Posted: (\\d{1,2} \\D{3} \\d{4})"
        - name: dateparse
          args: "2 Jan 2006"
    date:
      text: "{{ if .Result.date_optional }}{{ .Result.date_optional }}{{ else }}now{{ end }}"
    size_optional:
      optional: true
      selector: div.postContent
      filters:
        - name: regexp
          args: "File Size: ([0-9.]+ ?[KMGT]B)"
    size:
      text: "{{ if .Result.size_optional }}{{ .Result.size_optional }}{{ else }}0 B{{ end }}"
    # ABB publishes no peer counts. 1/1 keeps the *arrs' minimum-seeders
    # filter from discarding every result; qBittorrent finds peers via DHT.
    seeders:
      text: 1
    leechers:
      text: 1
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# engine n/a
