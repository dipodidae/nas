---
# AudioBookBay for Prowlarr -> bookshelf-audio (ADR-0058).
#
# TRACKED HERE, bind-mounted read-only into /config/Definitions/Custom/: Prowlarr
# removed ABB from its own definitions repo, so the only copy that survives a
# container or config rebuild is this one. Adapted from a community Cardigann
# definition whose domains were all dead; audiobookbay.lu is the one that
# answered on 2026-09-27.
#
# Five changes from that original, all load-bearing (the fifth: English and
# Dutch rows only -- see the INVARIANT on `rows`):
#   * a browser User-Agent on every request, and
#   * lowercase keywords -- both INVARIANTs in `search`.
#   * the title gets " [FORMAT]" appended (M4B, MP3, ...) from the post body.
#     ABB titles carry no format, so Bookshelf parsed every release as
#     "Unknown Audio" -- which the Spoken profile does not allow -- and would
#     have rejected all of them.
#   * the info hash is read from the detail page and becomes a magnet; ABB's
#     own .torrent link sits behind a redirect wall.
id: audiobookbay
name: AudioBookBay
description: "AudioBook Bay (ABB) is a public torrent tracker for AUDIOBOOKS"
language: en-US
type: public
encoding: UTF-8
links:
  - https://audiobookbay.lu/
legacylinks:
  - http://audiobookbay.fi/
  - http://audiobookbay.se/
  - http://audiobookbay.nl/
  - http://audiobookbayabb.com/

caps:
  categorymappings:
    - {id: "(Post)apocalyptic", cat: Audio/Audiobook, desc: "(Post)apocalyptic"}
    - {id: Action, cat: Audio/Audiobook, desc: "Action"}
