## playlist-generator app.conf -- bind-mounted read-only over
## /etc/nginx/sites-available/default inside the container.
##
## This is the submodule's own nginx/app.conf with its two `auth_basic` lines
## removed. The app's per-app basic auth is retired: the route sits behind the
## single tinyauth door at SWAG, shared with every other protected surface, so
## a second credential here would only mean two prompts for one page.
## ADR-0034.
##
## WHY A BIND MOUNT AND NOT AN EDIT UPSTREAM. The auth lives in
## ../jellyfin-playlist-generator, which is a separate GitHub repo
## (dipodidae/jellyfin-playlist-generator). Tracking the conf here and mounting
## it is the same move ADR-0022 already makes for SWAG's proxy-confs -- the
## conf IS the mechanism, so it belongs in the repo that owns the deployment,
## and it reverts with a single `git revert` instead of a submodule pin bump.
## `make check` asserts no live auth_basic survives in any tracked conf.
##
## KNOWN RESIDUE: the submodule's docker-entrypoint.sh still runs
## `htpasswd -cb /etc/nginx/.htpasswd`, and with AUTH_USER/AUTH_PASS now unset
## it takes its `admin`/`admin` fallback branch. That file is referenced by
## NOTHING once this conf is mounted, and re-referencing it would fail
## `make check`. Removing the entrypoint branch is a change to the other repo;
## see the Known gaps section of README.md.

server {
    listen 80;
    server_name _;

    # Static frontend files
    root /app/static;
    index index.html;

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for streaming endpoints
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check endpoint. Reached by the container's own healthcheck
    # (`curl -f http://localhost/health`) and by scripts/playlist_sync_stage.py
    # via `docker exec` -- neither goes through SWAG, so the tinyauth door on
    # the public route does not affect either.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
