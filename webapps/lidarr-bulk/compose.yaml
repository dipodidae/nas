# lidarr-bulk -- Nuxt app for bulk artist/album operations against Lidarr.
#
# Lives next to its Dockerfile so `build.context: .` resolves here.
#
# Several tabs are optional and hide themselves when their credentials are
# unset, which is why so much of the environment below has `:-` defaults: the
# AI "Discover" tab needs OPENAI_API_KEY, the "Spotify" tab needs all three
# SPOTIFY_* values, and the per-playlist "Recreate in Jellyfin" button needs
# the Jellyfin key + user id. Nothing here is required for the app to start.
#
# See also: the addAlbum/RefreshArtist clobber this app had to work around --
# a single-album add used to expand to the full discography because the
# addAlbum monitor PUT raced Lidarr's own RefreshArtist. Fixed in the app by
# wiring waitForArtistRefresh into addAlbum; a rebuild is required to pick that
# up (`docker compose up -d --build lidarr-bulk`).

services:

  lidarr-bulk:
    extends:
      file: ../../compose/_fragments.yaml
      service: svc-hardened-tz
    build:
      context: .
    image: nas/lidarr-bulk:latest
    pull_policy: build
    container_name: lidarr-bulk
    # The entrypoint chowns /config and then drops to `node` via su-exec, so it
    # needs these briefly at startup; the app runs unprivileged afterwards.
    # Declared locally rather than inherited from svc-lsio because this is not
    # an LSIO image and takes no PUID/PGID.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - LIDARR_URL=http://lidarr:8686
      - LIDARR_API_KEY=${API_KEY_LIDARR}
      - CONFIG_DIR=/config
      # No APP_USERNAME / APP_PASSWORD / APP_BEARER_TOKEN. The app's own session
      # login was removed on 2026-09-04: the public route is gated by the one
      # tinyauth door at SWAG, and on nas-network nothing but SWAG reaches it.
      # ADR-0034; `make check` asserts these do not come back.
      # Optional: AI "Discover" tab. Shares OPENAI_API_KEY with
      # playlist-generator. Tab hides if unset.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${LIDARR_BULK_OPENAI_MODEL:-gpt-4o}
      # Optional: "Spotify" tab. All three required or the tab hides. The
      # redirect URI is derived from PUBLIC_DOMAIN and must be registered in
      # the Spotify app dashboard.
      - SPOTIFY_API_CLIENT_ID=${SPOTIFY_API_CLIENT_ID:-}
      - SPOTIFY_API_CLIENT_SECRET=${SPOTIFY_API_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-https://lidarr-bulk.${PUBLIC_DOMAIN}/api/spotify/callback}
      # Optional: per-playlist "Recreate in Jellyfin". Reaches Jellyfin over
      # nas-network. NOTE this is API_KEY_JELLYFIN (Jellyseerr's key), not
      # API_KEY_JELLYFIN_ARR -- the two are not interchangeable. ADR-0016.
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${API_KEY_JELLYFIN}
      - JELLYFIN_USER_ID=${JELLYFIN_USER_ID}
      - RATE_LIMIT_PER_MINUTE=300
      - BODY_LIMIT_BYTES=262144
    volumes:
      - ${CONFIG_DIRECTORY}/lidarr-bulk:/config
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      lidarr:
        condition: service_started
    networks:
      - nas-network
    labels:
      # INVARIANT: no watchtower label -- locally-built image. ADR-0006.
      - swag=enable
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:3000/healthz']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
