## 4eva-rootpage.root.conf — bind-mounted by docker-compose.yml into
##   /config/nginx/site-confs/root.conf
##
## Serves the apex domain (4eva.me) by reverse-proxying to the 4eva-rootpage
## container. server_name is pinned to the apex so SWAG's wildcard subdomain
## handling still routes *.4eva.me to its own proxy-confs.
##
## The apex is PUBLIC. /ops.html and /ops-status.json are not -- they are
## path-scoped behind the one tinyauth door. ADR-0034.

# HTTP → HTTPS for root domain only
server {
    listen 80;
    listen [::]:80;
    server_name 4eva.me;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name 4eva.me;

    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    # The apex stays PUBLIC -- it is a landing page. The ops dashboard does
    # not. Server half of the one door here; the location half goes only in the
    # two exact-match locations below. ADR-0034.
    include /config/nginx/tinyauth-server.conf;

    # /ops.html publishes live stack status: which containers are unhealthy,
    # disk usage, SMART, queue depths, cron state. BOTH of these are gated, not
    # just the page -- /ops-status.json IS the data, and gating only the HTML
    # would leave the payload one URL away. The page fetches
    # ./ops-status.json from the same origin, so the browser sends the same
    # session cookie and the dashboard keeps working.
    #
    # The FEED is unaffected either way: scripts/media_ops_status.py runs on
    # host cron every 5 minutes and WRITES
    # ${CONFIG_DIRECTORY}/ops-status/ops-status.json, which is bind-mounted
    # read-only into the container. Nothing fetches this page to produce it.
    #
    # `location =` is an exact match and beats the `location /` prefix below,
    # so the door applies to exactly these two URLs.
    location = /ops.html {
        include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 4eva-rootpage;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location = /ops-status.json {
        include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 4eva-rootpage;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 4eva-rootpage;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
