## ongehoord.subdomain.conf — copy to:
##   ${CONFIG_DIRECTORY}/swag/nginx/proxy-confs/ongehoord.subdomain.conf
## Preview of the dipodidae/ongehoord-ui-content `dev` branch.
## Gated at THIS proxy layer, NOT in the app -- by tinyauth forward auth, one
## credential shared with every other protected route. ADR-0034.
##
## The two auth_basic lines that used to live in `location /` are GONE, and
## they cannot come back alongside the include: ngx_http_auth_basic_module runs
## BEFORE ngx_http_auth_request_module in the access phase, so its 401 is what
## `error_page 401 = @tinyauth_login` converts -- the auth subrequest is never
## made at all. Measured 2026-09-04: with both gates, a request carrying a valid
## tinyauth session and no Authorization header got a 302 and NOTHING reached
## tinyauth. "Both doors for one commit" is not two doors; it is basic auth
## wearing the login page as its error handler, and it locks out every real
## browser. The htpasswd file's retirement is the next commit.
# make sure that your ongehoord container is named ongehoord
# make sure that your dns has a CNAME for ongehoord pointing at PUBLIC_DOMAIN

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ongehoord.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 5m;

    # The one door. Server half; the location half is inside location / below.
    # ADR-0034.
    include /config/nginx/tinyauth-server.conf;

    location / {
        include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ongehoord;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
